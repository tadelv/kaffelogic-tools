name: pages

on:
  push:
    branches: [main, master]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The JS port must keep producing the same numbers as the Python CLI.
      - name: Reference test
        run: node web/test.mjs

      # Content-hashed asset URLs: GitHub Pages serves assets with max-age=14400,
      # so an unhashed app.js can be stale in a browser for hours after a deploy.
      - name: Build site
        run: node web/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
